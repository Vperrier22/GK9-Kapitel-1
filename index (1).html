<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Die neue Schule – Révision Kapitel 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--green:#2f9e44;--green-d:#1f6f30;--green-l:#e6f6e9;--yellow:#ffd43b;--yellow-l:#fff6cf;--ink:#1e2b22;--muted:#5d6b61;--bg:#f3faf2;--card:#fff;--line:#d5e6d6;--ok:#2b8a3e;--ok-l:#dff5e3;--ko:#c92a2a;--ko-l:#ffe3e3;--blue:#1c5fb0;--red:#c92a2a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Nunito,"Trebuchet MS",Verdana,sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.5}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
header.top{background:var(--green);color:#fff;padding:26px 0 54px;position:relative;overflow:hidden}
header.top::after{content:"1";position:absolute;right:-10px;top:-60px;font-weight:900;font-size:260px;line-height:1;color:rgba(255,255,255,.14)}
.top .kap{display:inline-block;background:var(--yellow);color:var(--ink);font-weight:800;padding:3px 14px;border-radius:999px;font-size:.85rem;transform:rotate(-2deg)}
.top h1{margin:10px 0 2px;font-size:clamp(2.1rem,7vw,3.4rem);font-weight:900;line-height:1.05}
.top p{margin:0;font-weight:600;opacity:.95}
.bar{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:2px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:12px;padding-top:8px;padding-bottom:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin}
.tabs button{white-space:nowrap;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 13px;font-weight:700;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--green);border-color:var(--green);color:#fff}
.tabs button .n{display:inline-block;min-width:1.4em;margin-right:4px;border-radius:999px;background:var(--yellow);color:var(--ink);text-align:center;font-weight:900}
.score{font-weight:800;white-space:nowrap;font-size:.92rem;text-align:right}
.score .track{display:block;width:92px;height:8px;background:var(--green-l);border-radius:9px;margin-top:3px;overflow:hidden}
.score .fill{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
main{margin-top:-30px;position:relative;padding-bottom:60px}
.panel{display:none}.panel.on{display:block}
.card{background:var(--card);border-radius:22px;padding:22px;margin:0 0 18px;border:2px solid var(--line)}
.sec-head{border-color:var(--green)}
.sec-head h2{margin:0;font-size:1.7rem;font-weight:900;color:var(--green-d)}
.sec-head .pg{float:right;background:var(--green-l);color:var(--green-d);font-weight:800;border-radius:999px;padding:2px 12px;font-size:.85rem;margin-left:10px}
.sec-head p{margin:4px 0 0;color:var(--muted);font-weight:600}
.memo{margin-top:14px;background:var(--yellow-l);border-left:6px solid var(--yellow);border-radius:12px;padding:10px 14px}
.der{color:var(--blue);font-weight:800}.das{color:var(--green-d);font-weight:800}.die{color:var(--red);font-weight:800}
.ex h3{margin:0;font-size:1.2rem;font-weight:800}
.ex h3 .id{display:inline-block;background:var(--yellow);border-radius:9px;padding:0 9px;margin-right:8px;font-weight:900}
.ex .instr{margin:4px 0 14px;color:var(--muted);font-weight:600}
.items{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.items.compact{grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.it{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;padding:8px 10px;border-radius:12px;border:2px solid transparent;background:#f7fbf6}
.it.pair{justify-content:space-between}
.it .de{font-weight:700}
.it.ok{background:var(--ok-l);border-color:var(--ok)}
.it.ko{background:var(--ko-l);border-color:var(--ko)}
.it .mark{margin-left:auto;font-weight:900;min-width:1.2em;text-align:center}
.it.pair .mark{margin-left:0}
.it.ok .mark{color:var(--ok)}.it.ko .mark{color:var(--ko)}
select,input[type=text],input[type=password]{border:2px solid var(--line);border-radius:10px;padding:5px 9px;background:#fff;max-width:100%}
input.gap{width:8.5em}input.gap.w1{width:15em}input.gap.w2{width:11em}
.opts{display:inline-flex;flex-wrap:wrap;gap:5px}
.opts button{border:2px solid var(--line);background:#fff;border-radius:10px;padding:3px 11px;font-weight:700;cursor:pointer}
.opts button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:#fff}
.blank{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--green);text-align:center;font-weight:800;color:var(--green-d);padding:0 4px}
.ord{flex-direction:column;align-items:stretch}
.line{min-height:44px;border-bottom:3px dashed var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:4px 0;align-items:center}
.pool{display:flex;flex-wrap:wrap;gap:6px;min-height:38px}
.tile{border:2px solid var(--green);background:#fff;border-radius:10px;padding:3px 11px;font-weight:700;cursor:pointer}
.line .tile{background:var(--green-l)}
.ordrow{display:flex;gap:8px;align-items:center}.ordrow .line{flex:1}
.uml{display:flex;gap:5px;align-items:center;margin-bottom:10px;font-size:.9rem;color:var(--muted);font-weight:600}
.uml button{border:2px solid var(--line);background:#fff;border-radius:8px;width:34px;height:32px;font-weight:800;cursor:pointer}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.btn{border:0;border-radius:12px;padding:9px 18px;font-weight:800;cursor:pointer;background:var(--green);color:#fff}
.btn.sec{background:#fff;color:var(--green-d);border:2px solid var(--green)}
.fb{font-weight:800}
.steck{background:var(--green-l);border-radius:14px;padding:12px 16px;margin-bottom:14px;max-width:340px;transform:rotate(-1deg)}
.steck-t{font-weight:900;color:var(--green-d);margin-bottom:4px}
.steck dl{display:grid;grid-template-columns:auto 1fr;gap:1px 14px;margin:0}
.steck dt{color:var(--green-d);font-weight:700}.steck dd{margin:0;font-weight:700}
.plan{max-width:520px;margin:0 auto 16px}
.roof{height:0;border-left:40px solid transparent;border-right:40px solid transparent;border-bottom:34px solid var(--green);margin:0 -6px}
.floor{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:20px 6px 6px;border:3px solid var(--green);border-top-width:0;background:#fff;position:relative}
.floor .fl{position:absolute;top:1px;left:8px;font-size:.78rem;font-weight:900;color:var(--green-d)}
.floor i{font-style:normal;font-weight:700;background:var(--yellow-l);border:2px solid var(--yellow);border-radius:8px;text-align:center;padding:7px 2px;font-size:.88rem;overflow-wrap:anywhere}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.home-grid button{text-align:left;border:2px solid var(--line);background:#fff;border-radius:18px;padding:14px;cursor:pointer}
.home-grid button:hover{border-color:var(--green)}
.home-grid b{display:block;font-size:1.1rem;font-weight:900;color:var(--green-d)}
.home-grid small{display:block;color:var(--muted);font-weight:600;font-size:.9rem;line-height:1.35;margin-top:3px}
.home-grid .done{display:block;margin-top:6px;font-weight:800;font-size:.85rem}
ol.how{margin:8px 0 0;padding-left:1.2em}
.key h4{margin:18px 0 6px;font-size:1.1rem;color:var(--green-d);font-weight:900}
.key h5{margin:10px 0 2px;font-size:1rem;font-weight:800}
.key ol{margin:0;padding-left:1.4em}
.key b{color:var(--green-d)}
.lock{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
footer{text-align:center;color:var(--muted);font-size:.85rem;font-weight:600;padding:0 16px 30px}
@media (max-width:560px){body{font-size:16px}.card{padding:16px;border-radius:18px}.score .track{width:64px}.it.pair{flex-direction:column;align-items:flex-start}.it.pair select{width:100%}}
@media print{.bar,.act,.uml{display:none}.panel{display:block}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<span class="kap">Wiederholung · Kapitel 1</span>

</div></div>

  bc.addEventListener("click",function(){check(ex)});br.addEventListener("click",function(){fill(ex)});
  fill(ex);return card;
}
function fill(ex){
  var ul=ex.ul;ul.innerHTML="";ex.fb.textContent="";ex.get=[];
  var pool=ex.type==="select"?shuffle(ex.items.map(function(i){return i.a}).filter(function(v,i,a){return a.indexOf(v)===i})):null;
  ex.items.forEach(function(it,n){
    var li=el("li","it");var get;
    if(ex.type==="select"){li.classList.add("pair");li.appendChild(el("span","de",it.q));
      var s=el("select");s.setAttribute("aria-label","Réponse pour : "+it.q);s.appendChild(new Option("– choisis –",""));pool.forEach(function(o){s.appendChild(new Option(o,o))});
      var w=el("span");w.style.display="flex";w.style.gap="6px";w.style.alignItems="center";w.appendChild(s);li.appendChild(w);li._markHost=w;get=function(){return s.value}}
    else if(ex.type==="input"){var inp;splitQ(li,it.q,function(){inp=el("input","gap"+(it.w?" w"+it.w:""));inp.type="text";inp.autocomplete="off";inp.autocapitalize="off";inp.spellcheck=false;inp.setAttribute("aria-label","Réponse "+(n+1));
        inp.addEventListener("focus",function(){ex.last=inp});inp.addEventListener("keydown",function(e){if(e.key==="Enter")check(ex)});return inp});
      get=function(){return inp.value}}
    else if(ex.type==="choice"){var val="",bl=null;
      var hasGap=it.q.indexOf("___")>=0;
      splitQ(li,it.q,function(){bl=el("span","blank","…");return bl});
      var o=el("span","opts");o.setAttribute("role","group");
      it.opts.forEach(function(op){var b=el("button",null,op);b.type="button";b.setAttribute("aria-pressed","false");
        b.addEventListener("click",function(){val=op;if(bl)bl.textContent=op;Array.prototype.forEach.call(o.children,function(c){c.setAttribute("aria-pressed",c===b?"true":"false")});li.classList.remove("ok","ko");var m=li.querySelector(".mark");if(m)m.textContent=""});
        o.appendChild(b)});li.appendChild(o);get=function(){return val}}
    else if(ex.type==="order"){li.classList.add("ord");var chosen=[];var sol=it.t.join(" ");
      var sh=shuffle(it.t),g=0;while(sh.join(" ")===sol&&g++<20)sh=shuffle(it.t);
      var row=el("div","ordrow"),line=el("div","line"),pl=el("div","pool");line.setAttribute("aria-label","Ta phrase "+(n+1));row.appendChild(line);li.appendChild(row);li.appendChild(pl);li._markHost=row;
      sh.forEach(function(tok){var b=el("button","tile",tok);b.type="button";
        b.addEventListener("click",function(){if(b.parentNode===pl){line.appendChild(b);chosen.push(b)}else{pl.appendChild(b);chosen.splice(chosen.indexOf(b),1)}li.classList.remove("ok","ko");var m=li.querySelector(".mark");if(m)m.textContent=""});
        pl.appendChild(b)});
      get=function(){return chosen.map(function(b){return b.textContent}).join(" ")}}
    var mk=el("span","mark");mk.setAttribute("aria-hidden","true");(li._markHost||li).appendChild(mk);
    ex.get.push(get);ul.appendChild(li);
  });
}
function check(ex){
  var ok=0,empty=0;
  ex.items.forEach(function(it,i){
    var v=ex.get[i](),li=ex.ul.children[i],good;
    if(!v||!v.trim())empty++;
    if(ex.type==="input")good=it.a.some(function(a){return norm(a)===norm(v)});
    else if(ex.type==="order")good=v===it.t.join(" ");
    else good=v===it.a;
    li.classList.toggle("ok",good);li.classList.toggle("ko",!good);
    li.querySelector(".mark").textContent=good?"✓":"✗";if(good)ok++;
  });
  var n=ex.items.length,msg=ok+" / "+n+" – ";
  if(ok===n)msg+="Super, alles richtig!";
  else if(empty)msg+="Il manque encore "+empty+" réponse"+(empty>1?"s":"")+".";
  else if(ok>=n*0.6)msg+="Fast! Corrige les réponses en rouge et vérifie encore.";
  else msg+="Relis l'encadré jaune en haut de la page, puis réessaie.";
  ex.fb.textContent=msg;ex.fb.style.color=ok===n?"var(--ok)":"var(--ink)";
  if(!(best[ex.id]>=ok)){best[ex.id]=ok;score()}
}
function score(){
  var s=0;Object.keys(best).forEach(function(k){s+=best[k]});
  document.getElementById("scoreTxt").textContent=s+" / "+total+" Punkte";
  document.getElementById("scoreFill").style.width=(total?100*s/total:0)+"%";
  D.sections.forEach(function(sec){var a=0,b=0;sec.exercises.forEach(function(e){a+=best[e.id]||0;b+=e.items.length});
    var d=document.getElementById("done-"+sec.id);if(d){d.textContent=a+" / "+b+(a===b?" ✓":"");d.style.color=a===b?"var(--ok)":"var(--muted)"}});
}

/* ---------- navigation ---------- */
var tabs=document.getElementById("tabs"),main=document.getElementById("main"),panels={};
function show(id){Object.keys(panels).forEach(function(k){panels[k].panel.classList.toggle("on",k===id);panels[k].tab.setAttribute("aria-selected",k===id?"true":"false")});
  panels[id].tab.scrollIntoView({block:"nearest",inline:"nearest"});window.scrollTo(0,0)}
function addTab(id,label,num){var b=el("button");b.type="button";b.setAttribute("role","tab");if(num){b.appendChild(el("span","n",num))}b.appendChild(document.createTextNode(label));
  b.addEventListener("click",function(){show(id)});tabs.appendChild(b);var p=el("div","panel");p.setAttribute("role","tabpanel");main.appendChild(p);panels[id]={tab:b,panel:p};return p}

/* corrigé protégé */
var kp=addTab("key","Corrigé 🔒");
var kc=el("section","card sec-head key");
kc.innerHTML="<h2>Corrigé</h2><p>Réservé à l'enseignant·e. Entre le mot de passe pour afficher toutes les réponses.</p>";
var lock=el("div","lock"),pw=el("input");pw.type="password";pw.setAttribute("aria-label","Mot de passe");pw.placeholder="Mot de passe";pw.autocomplete="off";
var ob=el("button","btn","Afficher le corrigé");ob.type="button";var kfb=el("span","fb");kfb.setAttribute("aria-live","polite");
lock.appendChild(pw);lock.appendChild(ob);lock.appendChild(kfb);kc.appendChild(lock);
var kbody=el("div");kc.appendChild(kbody);kp.appendChild(kc);
function openKey(){
  if(sha256(pw.value.trim())!==KEY){kfb.textContent="Mot de passe incorrect.";kfb.style.color="var(--ko)";return}
  unlocked=true;pw.value="";lock.style.display="none";kbody.innerHTML="";
  D.sections.forEach(function(sec,i){kbody.appendChild(el("h4",null,(i+1)+"  "+sec.title+" ("+sec.page+")"));
    sec.exercises.forEach(function(ex){kbody.appendChild(el("h5",null,ex.id+"  "+ex.title));var ol=el("ol");
      ex.items.forEach(function(it){var li=el("li"),a=ans(it);
        if(ex.type==="order"){li.appendChild(el("b",null,a))}
        else if(it.q.indexOf("___")>=0){var ps=it.q.split("___");li.appendChild(document.createTextNode(ps[0]));li.appendChild(el("b",null,a));li.appendChild(document.createTextNode(ps[1]||""))}
        else{li.appendChild(document.createTextNode(it.q+" → "));li.appendChild(el("b",null,a))}
        ol.appendChild(li)});kbody.appendChild(ol)})});
  var cl=el("div","act"),cb=el("button","btn sec","Fermer le corrigé");cb.type="button";
  cb.addEventListener("click",function(){kbody.innerHTML="";lock.style.display="";kfb.textContent="";unlocked=false});cl.appendChild(cb);kbody.appendChild(cl);
}
ob.addEventListener("click",openKey);pw.addEventListener("keydown",function(e){if(e.key==="Enter")openKey()});

score();show("home");
})();
